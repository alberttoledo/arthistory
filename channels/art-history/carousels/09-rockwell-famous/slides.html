<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../_brand/brand.css">
<style>
  /* Rockwell, the fun ones: a title cover, then one full-bleed painting per slide, no frame, no text. Everything else lives in the caption. */
  .mosaic { position:absolute; inset:-6px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:6px; background:var(--ink); }
  .mosaic img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; }
  .s-mosaic.shade-bottom::after { height:780px; background:linear-gradient(transparent, rgba(13,11,9,.78) 38%, rgba(13,11,9,.96) 70%); }
  .s-mosaic .block.bottom { bottom:150px; }
  .s-mosaic .h-xl { font-size:150px; margin:0 0 26px; text-shadow:0 2px 24px rgba(0,0,0,.6); }
  .s-mosaic .lede { font-size:44px; }
  .s-bleed .bleed { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .s-bleed .fx { display:none; }
  .s-bleed .foot { text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 14px rgba(0,0,0,.5); }
</style></head>
<body data-title="Rockwell" data-chrome="handle">
<section class="slide s-cover s-mosaic shade-bottom">
  <div class="mosaic"><img src="img/shiner.jpg"><img src="img/rosie.jpg"><img src="img/connoisseur.jpg"><img src="img/critic.jpg"><img src="img/triple.jpg"><img src="img/soda.jpg"><img src="img/runaway.jpg"><img src="img/tattoo.jpg"><img src="img/want.jpg"></div>
  <div class="block bottom"><h1 class="h-xl">You know <em>these</em> paintings.</h1><p class="lede">Do you know who painted them?</p></div>
</section>
<section class="slide s-bleed"><img class="bleed" src="img/shiner.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/connoisseur.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/rosie.jpg" style="object-position:50% 40%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/critic.jpg" style="object-position:80% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/runaway.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/tattoo.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/soda.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/triple.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/doctor.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/umpires.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/want.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/tv.jpg" style="object-position:50% 50%"></section>
<script src="../_brand/brand.js"></script></body></html>
