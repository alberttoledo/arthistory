<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../_brand/brand.css">
<style>
  /* Rockwell, a picked set: a title cover, then one full-bleed painting per slide, no frame, no text. Everything else lives in the caption. */
  .mosaic { position:absolute; inset:-6px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:6px; background:var(--ink); }
  .mosaic img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; }
  .s-mosaic.shade-bottom::after { height:780px; background:linear-gradient(transparent, rgba(13,11,9,.78) 38%, rgba(13,11,9,.96) 70%); }
  .s-mosaic .block.bottom { bottom:150px; }
  .s-mosaic .h-xl { font-size:150px; margin:0 0 26px; text-shadow:0 2px 24px rgba(0,0,0,.6); }
  .s-mosaic .lede { font-size:44px; }
  .s-bleed .bleed { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .s-bleed .fx { display:none; }
  .s-bleed .foot { text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 14px rgba(0,0,0,.5); }
  .s-single .bleed { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 100%; }
  .s-single.shade-bottom::after { top:0; bottom:auto; height:720px; background:linear-gradient(rgba(13,11,9,.92), rgba(13,11,9,.72) 50%, transparent); }
  .s-single .block.bottom { top:130px; bottom:auto; }
</style></head>
<body data-title="Rockwell" data-chrome="off">
<section class="slide s-cover s-mosaic s-single shade-bottom">
  <img class="bleed" src="img/window.jpg">
  <div class="block bottom"><h1 class="h-xl">You know <em>these</em> paintings.</h1><p class="lede">Do you know who painted them?</p></div>
</section>
<section class="slide s-bleed"><img class="bleed" src="img/remembered.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/trio.jpg" style="object-position:50% 60%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/parade.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/moon.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/signpainter.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/pie.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/kiss.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/want.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/street.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/tv.jpg" style="object-position:50% 50%"></section>
<section class="slide s-bleed"><img class="bleed" src="img/fishing.jpg" style="object-position:50% 50%"></section>
<script src="../_brand/brand.js"></script></body></html>
